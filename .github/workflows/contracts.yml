name: contracts

on:
  push:
    paths:
      - 'contracts/**'
      - 'services/core/**'
      - 'scripts/check-openapi-drift.php'
      - '.github/workflows/contracts.yml'
  pull_request:
    paths:
      - 'contracts/**'
      - 'services/core/**'
      - 'scripts/check-openapi-drift.php'
      - '.github/workflows/contracts.yml'

permissions:
  contents: read

jobs:
  lint:
    name: Lint OpenAPI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Spectral lint
        run: npx --yes @stoplight/spectral-cli@6 lint contracts/openapi.yaml

  drift:
    name: Schema drift
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      # Без .env в CI title схемы взялся бы из дефолта config('app.name') —
      # 'Laravel'. Фиксируем то же значение, что в .env.example.
      APP_NAME: 'Foundation API'
      APP_URL: http://localhost:8000
      APP_KEY: 'base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      # Анонимные запросы к api.github.com лимитированы 60/ч на IP, а раннеры
      # Actions используют общие адреса -> HTTP 429 при скачивании dist-архивов.
      # GITHUB_TOKEN поднимает лимит, композит применяет его к api/codeload.
      COMPOSER_AUTH: '{"github-token": "${{ secrets.GITHUB_TOKEN }}"}'
      # 10 параллельных загрузок по умолчанию — прямой путь к 429 на холодном кэше.
      COMPOSER_MAX_PARALLEL_HTTP: "4"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Composer cache directory
        id: composer-cache
        working-directory: services/core
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer downloads
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('services/core/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        working-directory: services/core
        run: |
          for attempt in 1 2 3; do
            composer install --no-interaction --prefer-dist --no-progress && exit 0
            if [ "$attempt" = 3 ]; then
              exit 1
            fi
            echo "::warning::composer install failed (attempt $attempt), retrying in 30s"
            sleep 30
          done

      - name: Export OpenAPI from Laravel
        working-directory: services/core
        run: php artisan scramble:export --path=storage/app/openapi.json

      - name: Update snapshot
        run: cp services/core/storage/app/openapi.json contracts/generated/openapi.json

      - name: Publish generated schema
        uses: actions/upload-artifact@v6
        with:
          name: openapi-generated
          path: contracts/generated/openapi.json
          retention-days: 30

      - name: Endpoints are covered by contract
        run: php scripts/check-openapi-drift.php
