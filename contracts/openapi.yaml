openapi: 3.1.0

info:
  title: II API
  summary: REST API сервиса core
  description: |
    Контракт HTTP API — источник истины для фронтенда и других сервисов.

    Правила:
    - схема меняется сначала здесь, затем в коде;
    - ломающие изменения — только в новой major-версии;
    - каждое изменение фиксируется в CHANGELOG.md.
  version: 0.1.0
  contact:
    name: II backend team
  license:
    name: MIT
    identifier: MIT

servers:
  - url: http://localhost:8000
    description: Локальная разработка через docker compose
  - url: https://api.example.com
    description: Заглушка staging — заменить на реальный домен

tags:
  - name: system
    description: Служебные эндпоинты, не для клиентов
  - name: auth
    description: Аутентификация и текущий пользователь

security:
  - sanctum: []

paths:
  /up:
    get:
      operationId: healthCheck
      tags:
        - system
      summary: Проверка живости приложения
      description: |
        Отдаёт HTML-страницу со статусом 200. Используется инфраструктурой
        и healthcheck-ами, клиентам не нужен.
      security: []
      responses:
        '200':
          description: Приложение отвечает
          content:
            text/html:
              schema:
                type: string

  /api/user:
    get:
      operationId: getCurrentUser
      tags:
        - auth
      summary: Текущий пользователь
      description: Возвращает пользователя, которому принадлежит Bearer-токен Sanctum.
      security:
        - sanctum: []
      responses:
        '200':
          description: Пользователь найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Токен отсутствует или недействителен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    sanctum:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
      description: |
        Персональный токен Sanctum. Передаётся заголовком
        `Authorization: Bearer <token>`. Cookie-сессии не используются.

  schemas:
    User:
      type: object
      required:
        - id
        - name
        - email
      properties:
        id:
          type: integer
          format: int64
          examples:
            - 1
        name:
          type: string
          examples:
            - Test User
        email:
          type: string
          format: email
          examples:
            - user@example.com
        email_verified_at:
          type:
            - string
            - 'null'
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      additionalProperties: false

    Error:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          examples:
            - Unauthenticated.
      additionalProperties: false
