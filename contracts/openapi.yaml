openapi: 3.1.0

info:
  title: Foundation API
  summary: REST API сервиса core
  description: |
    Контракт HTTP API — источник истины для фронтенда и других сервисов.

    Правила:
    - схема меняется сначала здесь, затем в коде;
    - ломающие изменения — только в новой major-версии;
    - каждое изменение фиксируется в CHANGELOG.md.
  version: 0.2.0
  contact:
    name: Foundation backend team
  license:
    name: MIT
    identifier: MIT

servers:
  - url: http://localhost:8000
    description: Локальная разработка через docker compose
  - url: https://api.example.com
    description: Заглушка staging — заменить на реальный домен

tags:
  - name: system
    description: Служебные эндпоинты, не для клиентов
  - name: auth
    description: Аутентификация и текущий пользователь

security:
  - sanctum: []

paths:
  /up:
    get:
      operationId: healthCheck
      tags:
        - system
      summary: Проверка живости приложения
      description: |
        Отдаёт HTML-страницу со статусом 200. Используется инфраструктурой
        и healthcheck-ами, клиентам не нужен.
      security: []
      responses:
        '200':
          description: Приложение отвечает
          content:
            text/html:
              schema:
                type: string

  /api/v1/auth/token:
    post:
      operationId: issueToken
      tags:
        - auth
      summary: Выдать персональный токен
      description: |
        Проверяет email и пароль и возвращает Bearer-токен Sanctum.
        Неверные учётные данные дают 422 с ошибкой поля `email`,
        а не 401 — чтобы клиент отличал их от отсутствия токена.
        Ограничение: 6 попыток в минуту с одного IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '201':
          description: Токен выдан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: Ошибка валидации или неверные учётные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '429':
          description: Превышен лимит попыток
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      operationId: revokeToken
      tags:
        - auth
      summary: Отозвать текущий токен
      description: Удаляет токен, которым авторизован текущий запрос.
      security:
        - sanctum: []
      responses:
        '204':
          description: Токен отозван
        '401':
          description: Токен отсутствует или недействителен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/me:
    get:
      operationId: getMe
      tags:
        - auth
      summary: Текущий пользователь
      description: Возвращает пользователя, которому принадлежит Bearer-токен Sanctum.
      security:
        - sanctum: []
      responses:
        '200':
          description: Пользователь найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '401':
          description: Токен отсутствует или недействителен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    sanctum:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
      description: |
        Персональный токен Sanctum. Передаётся заголовком
        `Authorization: Bearer <token>`. Cookie-сессии не используются.

  schemas:
    User:
      type: object
      required:
        - id
        - name
        - email
      properties:
        id:
          type: integer
          format: int64
          examples:
            - 1
        name:
          type: string
          examples:
            - Test User
        email:
          type: string
          format: email
          examples:
            - user@example.com
        email_verified_at:
          type:
            - string
            - 'null'
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      additionalProperties: false

    UserEnvelope:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/User'
      additionalProperties: false

    TokenRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          format: password
        device_name:
          type: string
          maxLength: 255
          default: api
          description: Метка устройства для выданного токена
      additionalProperties: false

    TokenResponse:
      type: object
      required:
        - token
        - token_type
        - user
      properties:
        token:
          type: string
          description: Персональный токен Sanctum в открытом виде
        token_type:
          type: string
          enum:
            - Bearer
        user:
          $ref: '#/components/schemas/User'
      additionalProperties: false

    Error:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          examples:
            - Unauthenticated.
      additionalProperties: false

    ValidationError:
      type: object
      required:
        - message
        - errors
      properties:
        message:
          type: string
          examples:
            - The given data was invalid.
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
      additionalProperties: false
