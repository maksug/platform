name: foundation

# ============================================================
# Платформа: сеть, данные, HTTP-фасад, dev-инструменты.
# Сервисы подключаются фрагментами через `include:` — каждый сервис
# владеет своим образом, зависимостями и воркерами.
# ============================================================

include:
  - ../services/core/compose.yml
  - ../frontend/portfolio/compose.yml

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # HTTP-фасад. Корень указывает на public/ сервиса core.
  nginx:
    image: nginx:1.29-alpine
    container_name: foundation-nginx
    ports:
      # API публикуем на всех интерфейсах: нужен доступ из сети (телефон)
      - "${APP_PORT:-8000}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ../services/core:/var/www/core:ro
    depends_on:
      core:
        condition: service_healthy
    networks:
      - foundation
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'nginx: master' > /dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *logging

  pg:
    image: postgres:18-alpine
    container_name: foundation-pg
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-api}"
      POSTGRES_USER: "${POSTGRES_USER:-api}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-secret}"
    ports:
      # Только loopback: БД не должна слушать локальную сеть
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      # PostgreSQL 18+: том монтируется в /var/lib/postgresql (не .../data)
      - pgdata:/var/lib/postgresql
      - ./postgres/init-db.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - foundation
    restart: unless-stopped
    logging: *logging

  redis:
    image: redis:8-alpine
    container_name: foundation-redis
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    # Порт не публикуем: в dev хватает `docker compose exec redis redis-cli`
    volumes:
      - redisdata:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - foundation
    restart: unless-stopped
    logging: *logging

  # Перехватчик писем: SMTP 1025 внутри сети, UI на хосте
  mailpit:
    image: axllent/mailpit:latest
    container_name: foundation-mailpit
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
    networks:
      - foundation
    restart: unless-stopped
    logging: *logging

  # Веб-клиент к PostgreSQL
  adminer:
    image: adminer:latest
    container_name: foundation-adminer
    environment:
      ADMINER_DEFAULT_SERVER: pg
      ADMINER_DESIGN: pepa-linha
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8080}:8080"
    depends_on:
      - pg
    networks:
      - foundation
    restart: unless-stopped
    logging: *logging

  # Kafka — брокер событий в режиме KRaft (без Zookeeper: cp-kafka 8.x его не поддерживает).
  # Один узел совмещает broker и controller — достаточно для dev.
  kafka:
    image: confluentinc/cp-kafka:8.1.0
    container_name: foundation-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      CLUSTER_ID: HeE59rmlFEq2hVdaMwskUQ
      # INTERNAL — docker-сеть (kafka:9092), EXTERNAL — хост (localhost:9094),
      # CONTROLLER — служебный listener KRaft, наружу не публикуется.
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9094,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9094}:9094"
    volumes:
      - kafkadata:/var/lib/kafka/data
    networks:
      - foundation
    restart: unless-stopped
    healthcheck:
      # В образе нет nc: проверка порта через bash /dev/tcp
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9092'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging: *logging

volumes:
  pgdata:
    name: foundation-pgdata
  redisdata:
    name: foundation-redisdata
  kafkadata:
    name: foundation-kafkadata

networks:
  foundation:
    name: foundation
