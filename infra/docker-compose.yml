name: ii

# ============================================================
# Платформа: сеть, данные, HTTP-фасад, dev-инструменты.
# Сервисы подключаются фрагментами через `include:` — каждый сервис
# владеет своим образом, зависимостями и воркерами.
# ============================================================

include:
  - ../services/core/compose.yml

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # HTTP-фасад. Корень указывает на public/ сервиса core.
  nginx:
    image: nginx:1.29-alpine
    container_name: ii-nginx
    ports:
      # API публикуем на всех интерфейсах: нужен доступ из сети (телефон)
      - "${APP_PORT:-8000}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ../services/core:/var/www/core:ro
    depends_on:
      core:
        condition: service_healthy
    networks:
      - ii
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'nginx: master' > /dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *logging

  pg:
    image: postgres:18-alpine
    container_name: ii-pg
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-api}"
      POSTGRES_USER: "${POSTGRES_USER:-api}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-secret}"
    ports:
      # Только loopback: БД не должна слушать локальную сеть
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      # PostgreSQL 18+: том монтируется в /var/lib/postgresql (не .../data)
      - pgdata:/var/lib/postgresql
      - ./postgres/init-db.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - ii
    restart: unless-stopped
    logging: *logging

  redis:
    image: redis:8-alpine
    container_name: ii-redis
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    # Порт не публикуем: в dev хватает `docker compose exec redis redis-cli`
    volumes:
      - redisdata:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - ii
    restart: unless-stopped
    logging: *logging

  # Перехватчик писем: SMTP 1025 внутри сети, UI на хосте
  mailpit:
    image: axllent/mailpit:latest
    container_name: ii-mailpit
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
    networks:
      - ii
    restart: unless-stopped
    logging: *logging

  # Веб-клиент к PostgreSQL
  adminer:
    image: adminer:latest
    container_name: ii-adminer
    environment:
      ADMINER_DEFAULT_SERVER: pg
      ADMINER_DESIGN: pepa-linha
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8080}:8080"
    depends_on:
      - pg
    networks:
      - ii
    restart: unless-stopped
    logging: *logging

volumes:
  pgdata:
    name: ii-pgdata
  redisdata:
    name: ii-redisdata

networks:
  ii:
    name: ii
