server {
    listen 80;
    server_name _;

    # Корень — public/ сервиса core (монтируется в /var/www/core)
    root /var/www/core/public;
    index index.php;

    client_max_body_size 20M;

    # Основной маршрутизатор Laravel
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Static favicon / robots
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # PHP-FPM сервиса core
    location ~ \.php$ {
        fastcgi_pass core:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60;
    }

    # Static assets — кэшируем на 7 дней
    location ~* \.(?:js|css|woff2?|png|jpe?g|svg|ico|map|webp)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    # Скрытые файлы
    location ~ /\. { deny all; }

    # Безопасность: не показываем точку доступа к скрытым файлам
    location ~ /\.(?!well-known).* { deny all; }
}
