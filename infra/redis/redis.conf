# ============================================================
# Redis dev-only конфигурация
# ============================================================

# Persistence: включаем AOF, чтобы очереди не теряли задачи при рестарте
appendonly yes
appendfsync everysec

# SNAПSHOTS не нужны — AOF достаточно
save ""

# Логирование
loglevel notice

# Память: для dev не ограничиваем; в проде укажите maxmemory + policy
# maxmemory 256mb
# maxmemory-policy allkeys-lru
