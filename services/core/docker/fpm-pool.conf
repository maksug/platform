[www]

; Пропускаем переменные окружения через PHP-FPM (важно: Laravel читает DB_* из env)
clear_env = no

; Сетевой порт (совпадает с nginx fastcgi_pass)
listen = 9000

; Pool manager
pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

; Логирование
catch_workers_output = yes
decorate_workers_output = no
slowlog = /proc/self/fd/2

; Таймаут — убиваем зависший скрипт (защита от DDoS / бесконечных запросов)
request_terminate_timeout = 60

; Не дублировать X-Powered-By в заголовке
security.limit_extensions = .php
